# cargo audit settings for Jay's EasyTier build (see JAY.md, "Security updates").
#
# Cargo.lock covers the whole upstream workspace (GUI, web console, FFI, uptime monitor), but Jay only
# ships `easytier` built with `--no-default-features --features wireguard,smoltcp,tun,socks5,quic,zstd`.
# Every advisory below was read and checked against that build with
#   cargo tree -p easytier --no-default-features --features "$JAY_FEATURES" -e normal --target <t> -i <crate>
# for the Windows, macOS and Linux targets. Any advisory not listed here fails the audit, and so the release.
# Review this list whenever Cargo.lock or JAY_FEATURES changes.

[advisories]
ignore = [
    # --- Not compiled into Jay's build (other workspace members only) ---
    "RUSTSEC-2023-0071", # rsa: timing side channel
    "RUSTSEC-2024-0421", # idna 0.5 (the build uses idna 1.x)
    "RUSTSEC-2025-0004", # openssl
    "RUSTSEC-2025-0022", # openssl
    "RUSTSEC-2026-0463", # openssl
    "RUSTSEC-2026-0473", # openssl
    "RUSTSEC-2026-0474", # openssl
    "RUSTSEC-2026-0475", # openssl
    "RUSTSEC-2026-0476", # openssl
    "RUSTSEC-2026-0477", # openssl
    "RUSTSEC-2026-0478", # openssl
    "RUSTSEC-2026-0479", # openssl
    "RUSTSEC-2025-0132", # maxminddb
    "RUSTSEC-2026-0235", # rkyv
    "RUSTSEC-2026-0367", # zip
    "RUSTSEC-2026-0368", # zip
    "RUSTSEC-2026-0369", # zip
    "RUSTSEC-2026-0429", # zip
    "RUSTSEC-2026-0383", # webpki-root-certs
    "RUSTSEC-2026-0387", # crypto-bigint
    "RUSTSEC-2026-0459", # libsqlite3-sys
    # hickory 0.25.2 (hickory-proto, hickory-resolver). Not in Jay's build: easytier's only path to
    # 0.25.2 is the magic-dns feature (hickory-client/hickory-server 0.25, plus the renamed
    # hickory-proto-v25/hickory-resolver-v25 deps in easytier/Cargo.toml). magic-dns is in upstream's
    # default features, but Jay builds with --no-default-features. For Jay's features,
    # `cargo tree -e normal --target <t> -i hickory-proto@0.25.2` (and hickory-resolver@0.25.2,
    # hickory-client, hickory-server) matches no package on Windows, macOS, Linux or Android. Jay's build
    # uses hickory-resolver/hickory-proto/hickory-net 0.26.3, which none of these flag.
    # TODO(exit): delete these entries once magic-dns moves to hickory-client 0.26 (or is removed).
    #
    # Malicious DNS answers: panics and memory amplification (0118 is in DNSSEC code, 0490 in zone-file
    # parsing). Fixed in 0.26.1/0.26.2.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    "RUSTSEC-2026-0487",
    "RUSTSEC-2026-0489",
    "RUSTSEC-2026-0490",
    "RUSTSEC-2026-0491",
    # DNSSEC validation flaws. They only matter when DNSSEC validation is on. No hickory dnssec-*
    # feature is enabled anywhere in the graph, even with magic-dns.
    "RUSTSEC-2026-0504", # hickory-proto 0.25.0..<0.26.0-beta.1: inverted NSEC3 comparison forges
                         # non-existence proofs. Fixed in hickory-net 0.26.2.
    "RUSTSEC-2026-0505", # hickory-proto <0.26.0-beta.1: NSEC3 owner name not checked against the
                         # zone. Fixed in hickory-net 0.26.2.
    "RUSTSEC-2026-0511", # hickory-proto <0.26.0-beta.1: NXDOMAIN accepted for a proven empty
                         # non-terminal. Fixed in hickory-net 0.26.2.
    "RUSTSEC-2026-0512", # hickory-proto <0.26.0-beta.1: an unrelated signed RRset accepted as the
                         # answer. Fixed in hickory-net 0.26.2.
    "RUSTSEC-2026-0514", # hickory-resolver <0.26.2: with DNSSEC validation enabled, lookup() and
                         # lookup_ip() returned bogus records as Ok. Only with validation on; plain
                         # lookups are unchanged. Fixed in 0.26.2.

    # --- In the build, reviewed, not reachable ---
    # quick-xml: only through plist in service-manager, which reads launchd plists when installing a
    # system service. Jay never installs EasyTier as a service.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # ringbuf: double free only when an element's Drop panics inside skip()/clear(). Release builds
    # use panic = "abort", so the process ends before a second drop. Fixed in 0.5, a breaking upgrade.
    "RUSTSEC-2026-0293",
    # zstd-sys: WebAssembly allocator shim only.
    "RUSTSEC-2026-0410",
]
